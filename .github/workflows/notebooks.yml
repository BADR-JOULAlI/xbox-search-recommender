name: notebooks

on:
  push:
  pull_request:

jobs:
  smoke-notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install pandas jupyter nbconvert nbformat pyyaml
      - name: Validate notebook JSON and outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat

          notebooks = sorted(Path("notebooks").glob("*.ipynb"))
          assert len(notebooks) == 13, notebooks
          for path in notebooks:
              notebook = nbformat.read(path, as_version=4)
              outputs = sum(len(cell.get("outputs", [])) for cell in notebook.cells)
              assert outputs == 0, f"{path} contient {outputs} outputs"
          print(f"{len(notebooks)} notebooks valides et sans outputs")
          PY
      - name: Execute data smoke notebook with synthetic fallback
        run: >-
          jupyter nbconvert --to notebook --execute
          notebooks/01_download_and_inspect_data.ipynb
          --output 01_smoke.executed.ipynb
          --output-dir /tmp
          --ExecutePreprocessor.timeout=120

